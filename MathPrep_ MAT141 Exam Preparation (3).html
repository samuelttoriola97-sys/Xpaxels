\theta=\\frac{\\frac15-2}{1+2\\cdot\\frac15}=\\frac{-9/5}{7/5}=-\\frac97$"], "a": "Acute angle: $\\tan\\theta=\\frac97$, $\\theta\\approx52.1^\\circ$", "m": "Mixing up which slope comes first, which only flips the sign.", "r": ["parperp", "line"]}, {"id": "circ", "t": 1, "n": "Equation of a circle", "x": "(x-h)^2+(y-k)^2=r^2", "s": "Centre $(h,k)$, radius $r$. General form $x^2+y^2+2gx+2fy+c=0$ has centre $(-g,-f)$ and $r^2=g^2+f^2-c$.", "u": "Writing a circle’s equation; finding the centre and radius by completing the square.", "c": "$r>0$, so $r^2$ must be positive.", "e": "Centre $(1,-2)$, radius $3$.", "st": ["$h=1,\\ k=-2,\\ r^2=9$", "$(x-1)^2+(y-(-2))^2=9$"], "a": "$(x-1)^2+(y+2)^2=9$", "m": "Writing $(x+h)$ instead of $(x-h)$, which flips the centre; writing $r$ instead of $r^2$.", "r": ["ptl", "par"], "g": "Circle"}, {"id": "par", "t": 1, "n": "Standard parabola", "x": "y^2=4ax", "s": "$a$ = distance from vertex to focus. Focus $(a,0)$; directrix $x=-a$.", "u": "Finding the focus and directrix, or writing a parabola’s equation.", "c": "Vertex at the origin, axis along the $x$-axis; opens right if $a>0$.", "e": "Focus and directrix of $y^2=12x$.", "st": ["$4a=12\\Rightarrow a=3$", "Focus $(a,0)=(3,0)$; directrix $x=-3$"], "a": "Focus $(3,0)$", "m": "Taking $a=12$ and forgetting the factor 4.", "r": ["circ"], "g": "Parabola"}, {"id": "circgen", "t": 1, "g": "Circle", "n": "Circle in general form", "x": "x^2+y^2+2gx+2fy+c=0,\\quad \\text{centre }(-g,-f),\\ r=\\sqrt{g^2+f^2-c}", "s": "$g,f,c$ are constants; $r$ = radius.", "u": "Finding the centre and radius when the equation is expanded.", "c": "Needs $g^2+f^2-c>0$.", "e": "Circle $x^2+y^2-6x+4y-12=0$.", "st": ["$2g=-6\\Rightarrow g=-3$; $2f=4\\Rightarrow f=2$; $c=-12$", "Centre $(3,-2)$", "$r=\\sqrt{9+4+12}=\\sqrt{25}$"], "a": "Centre $(3,-2)$, $r=5$", "m": "Reading the centre as $(g,f)$ instead of $(-g,-f)$.", "r": ["circ", "circdia"]}, {"id": "circdia", "t": 1, "g": "Circle", "n": "Circle with a given diameter", "x": "\\text{centre}=\\text{mid-point of }AB,\\qquad r=\\tfrac12|AB|", "s": "$A,B$ = ends of a diameter.", "u": "Writing the circle whose diameter joins two points.", "c": "Use the mid-point and distance formulas first.", "e": "Diameter from $(8,-2)$ to $(-4,3)$.", "st": ["Centre $=\\left(\\frac{8-4}{2},\\frac{-2+3}{2}\\right)=\\left(2,\\frac12\\right)$", "$|AB|=\\sqrt{12^2+5^2}=13$, so $r=\\frac{13}{2}$", "$(x-2)^2+\\left(y-\\frac12\\right)^2=\\frac{169}{4}$"], "a": "$4x^2+4y^2-16x-4y=152$", "m": "Using the full length $13$ as the radius.", "r": ["mid", "dist", "circ"]}, {"id": "conic", "t": 1, "g": "Conic sections", "n": "Eccentricity of a conic", "x": "e=\\frac{PS}{PM}", "s": "$P$ = moving point, $S$ = focus, $M$ = foot of the perpendicular from $P$ to the directrix.", "u": "Naming a conic: $e=0$ circle, $e=1$ parabola, $e<1$ ellipse, $e>1$ hyperbola.", "c": "$e\\ge0$.", "e": "A point has $PS=6$ and $PM=4$.", "st": ["$e=\\frac64=1.5$", "$e>1$"], "a": "The locus is a hyperbola.", "m": "Putting the distance to the directrix on top.", "r": ["par", "ell", "hyp"]}, {"id": "parlr", "t": 1, "g": "Parabola", "n": "Parabola: vertex form and latus rectum", "x": "(y-k)^2=4a(x-h),\\qquad \\text{latus rectum}=4a", "s": "Vertex $(h,k)$; focus $(h+a,k)$; directrix $x=h-a$.", "u": "Parabolas whose vertex is not at the origin.", "c": "Axis is parallel to the $x$-axis.", "e": "$(y-2)^2=8(x-1)$.", "st": ["$4a=8\\Rightarrow a=2$", "Vertex $(1,2)$, focus $(1+2,2)$"], "a": "Focus $(3,2)$, latus rectum $8$", "m": "Using $(x+h)$ for the vertex shift.", "r": ["par", "partan"]}, {"id": "partan", "t": 1, "g": "Parabola", "n": "Tangent and normal to a parabola", "x": "yy_1=2a(x+x_1),\\quad m_t=\\frac{2a}{y_1},\\quad y-y_1=-\\frac{y_1}{2a}(x-x_1)", "s": "$(x_1,y_1)$ is the point on $y^2=4ax$; $m_t$ = slope of the tangent.", "u": "Tangent and normal at a point of a parabola.", "c": "The point must lie on the parabola.", "e": "Tangent and normal to $y^2=6x$ at $(6,6)$.", "st": ["$4a=6\\Ri
